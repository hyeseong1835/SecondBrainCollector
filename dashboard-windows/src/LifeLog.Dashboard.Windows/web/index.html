<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SecondBrain Dashboard</title>
<style>
  :root { --bg:#111; --fg:#ddd; --mute:#888; --line:#2a2a2a; --accent:#6cf; --card:#181818; --btn:#222; --btn-border:#333; --btn-hover:#2c2c2c; --on:#2a3f55; --input:#1a1a1a; --tip-bg:#000; --tip-fg:#fff; --block-fg:#000; color-scheme: dark; }
  :root[data-theme="light"] { --bg:#f4f4f6; --fg:#1c1c1e; --mute:#6b6b70; --line:#dcdce0; --accent:#1a73e8; --card:#ffffff; --btn:#ffffff; --btn-border:#c9c9ce; --btn-hover:#ececf0; --on:#d6e6fb; --input:#ffffff; --tip-bg:#222; --tip-fg:#fff; --block-fg:#000; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 13px/1.4 "Segoe UI Variable", "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; flex-wrap:wrap; }
  header h1 { font-size:14px; margin:0 12px 0 0; font-weight:600; }
  button { background:var(--btn); color:var(--fg); border:1px solid var(--btn-border); border-radius:6px; padding:4px 10px; cursor:pointer; font:inherit; }
  button:hover { background:var(--btn-hover); }
  button.on { background:var(--on); border-color:var(--accent); }
  input, select { background:var(--input); color:var(--fg); border:1px solid var(--btn-border); border-radius:6px; padding:4px 8px; font:inherit; }
  h2, h3 { font-weight:600; margin: 12px 0 6px; }
  h3 .mute { font-weight:400; font-size:12px; }
  .date { font-variant-numeric: tabular-nums; min-width: 170px; text-align:center; }
  .spacer { flex:1; }
  .mute { color:var(--mute); }
  #tabs { display:flex; gap:4px; margin-left:12px; }
  .tab { border-radius:12px; padding:3px 12px; }
  .tab.on { background:var(--on); border-color:var(--accent); }
  .tab.add { color:var(--mute); }
  main { padding: 10px 12px 40px 12px; overflow-x: auto; }
  /* 보드: 위젯은 칸 좌표로 절대 배치. 창이 좁아져도 위치는 그대로이고 스크롤만 생긴다 */
  .board { position:relative; }
  .widget { position:absolute; background:var(--card); border:1px solid var(--line); border-radius:8px; display:flex; flex-direction:column; overflow:hidden; min-width:0; min-height:0; }
  .whead.movable { cursor:move; user-select:none; touch-action:none; }
  .handle { touch-action:none; }
  body.dragging iframe { pointer-events:none; }
  body.dragging { user-select:none; }
  .widget.resizing { outline: 2px solid var(--accent); }
  .whead { display:flex; align-items:center; justify-content:space-between; padding:6px 10px; border-bottom:1px solid var(--line); color:var(--mute); font-size:12px; flex:none; }
  .wtools button { padding:1px 6px; margin-left:2px; font-size:11px; }
  .wbody { flex:1; min-height:0; position:relative; overflow:auto; }
  .wbody iframe { width:100%; height:100%; border:0; background:transparent; display:block; }
  .wbody.timeline { padding: 4px 28px 8px 8px; }
  .handle { position:absolute; right:0; bottom:0; width:16px; height:16px; cursor:nwse-resize; background: linear-gradient(135deg, transparent 50%, var(--accent) 50%); opacity:.7; border-bottom-right-radius:8px; }
  .addbar { display:flex; gap:8px; align-items:center; padding:8px; margin-top:10px; border:1px dashed var(--btn-border); border-radius:8px; }
  .axis { position:relative; height:18px; margin-left: 180px; color:var(--mute); font-size:11px; overflow:visible; }
  .axis span { position:absolute; transform:translateX(-50%); }
  .lane { display:flex; align-items:stretch; min-height:26px; border-top:1px solid var(--line); }
  .lane .name { width:180px; padding:4px 8px 4px 0; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lane .track { position:relative; flex:1; height:26px; }
  .block { position:absolute; top:4px; height:18px; border-radius:3px; overflow:hidden; font-size:11px; line-height:18px; padding:0 3px; white-space:nowrap; color:var(--block-fg); }
  .tick { position:absolute; top:2px; width:2px; height:22px; background:var(--accent); }
  .empty { color:var(--mute); padding:12px; }
  .tip { position:fixed; pointer-events:none; background:var(--tip-bg); color:var(--tip-fg); padding:4px 8px; border-radius:4px; font-size:12px; display:none; z-index:9; max-width:480px; white-space:pre-line; }
  .warn { color:#e0a030; }
  #pluginsPage { padding: 12px; }
  #settingsPage { padding: 0; }
  .settings { display:flex; min-height: calc(100vh - 44px); }
  .settings .side { width:200px; flex:none; padding:16px 8px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:2px; }
  .settings .side .group { color:var(--mute); font-size:11px; margin:10px 8px 2px; text-transform:uppercase; letter-spacing:.3px; }
  .settings .side .item { text-align:left; background:transparent; border:1px solid transparent; padding:5px 10px; border-radius:6px; }
  .settings .side .item:hover { background:var(--btn-hover); }
  .settings .side .item.on { background:var(--on); border-color:var(--accent); }
  .settings .content { flex:1; padding:16px 24px; max-width:1100px; }
  .settings h2 { font-size:20px; margin:4px 0 14px; }
  .settings .field { margin:14px 0 18px; }
  .settings .field b { display:block; font-weight:600; margin-bottom:2px; }
  .settings .field p { margin:0 0 6px; }
  table.unmatched { border-collapse:collapse; width:100%; margin-top:6px; }
  table.unmatched th, table.unmatched td { text-align:left; vertical-align:top; padding:4px 8px; border-top:1px solid var(--line); font-size:12px; }
  table.unmatched th { color:var(--mute); font-weight:500; }
  table.unmatched td.num { white-space:nowrap; font-variant-numeric: tabular-nums; }
  table.unmatched td.ex { max-width:520px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  code { font: 12px Consolas, "Cascadia Mono", monospace; }
  mark { background:#c9a227; color:#000; border-radius:2px; padding:0 1px; }
  :root[data-theme="light"] mark { background:#ffe066; }
  table.unmatched.rx tr.ok td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  table.unmatched.rx td.ex { white-space:normal; max-width:640px; }
  .row.rx input { font: 12px Consolas, "Cascadia Mono", monospace; }
  #pluginsPage .row, #settingsPage .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  table.plugins, table.rules { border-collapse:collapse; margin-top:8px; width:100%; }
  table.plugins th, table.plugins td, table.rules th, table.rules td { text-align:left; vertical-align:top; padding:6px 8px; border-top:1px solid var(--line); font-size:12px; }
  table.plugins th, table.rules th { color:var(--mute); font-weight:500; }
  table.rules input { width:100%; }
  table.rules td:first-child { display:flex; align-items:center; gap:2px; }
  table.rules .indent { display:inline-block; flex:none; }
  table.rules td.tools { white-space:nowrap; }
  table.rules td.color { white-space:nowrap; }
  table.rules td.color input[type="color"] { width:34px; height:26px; padding:1px 2px; vertical-align:middle; }
  table.rules td.color button { padding:1px 6px; margin-left:3px; font-size:11px; }
  table.rules td.color input.ctext { width:96px; margin-left:4px; font: 11px Consolas, "Cascadia Mono", monospace; }
  table.rules td.color input.ctext.bad { border-color:#d33; }
  table.rules td.tools button { padding:1px 6px; margin-right:2px; font-size:11px; }
  table.rules tr.depth1 td, table.rules tr.depth2 td, table.rules tr.depth3 td, table.rules tr.depth4 td { border-top-color: transparent; background: color-mix(in srgb, var(--card) 70%, var(--bg)); }
  .chip { display:inline-block; padding:1px 6px; border-radius:10px; font-size:11px; }
  .chip.on { background:#1f4d2a; color:#9f9; } .chip.off { background:#444; color:#ccc; }
  :root[data-theme="light"] .chip.on { background:#d8f0dc; color:#1b6b2a; } :root[data-theme="light"] .chip.off { background:#e6e6ea; color:#555; }
  dialog { background:var(--card); color:var(--fg); border:1px solid var(--btn-border); border-radius:10px; min-width:340px; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog label { display:flex; justify-content:space-between; gap:12px; margin:8px 0; align-items:flex-start; }
  dialog .checks { display:flex; flex-direction:column; gap:4px; max-height:40vh; overflow:auto; }
  dialog input:not([type]) { min-width:280px; }
  dialog .stops { display:flex; flex-direction:column; gap:4px; min-width:330px; }
  dialog .stop { display:flex; align-items:center; gap:6px; }
  dialog .stop .sh { width:64px; }
  dialog .stop input[type="color"] { width:34px; height:24px; padding:1px 2px; }
  dialog .stop .sa { width:90px; }
  dialog .stop .sav { width:34px; text-align:right; }
  dialog .stop .sx { padding:1px 6px; font-size:11px; }
  dialog .stopbar { height:12px; border-radius:3px; background: repeating-conic-gradient(#8884 0% 25%, transparent 0% 50%) 0 0 / 8px 8px; overflow:hidden; }
  dialog .stopprev { display:block; height:100%; }
  dialog .chk { display:flex; justify-content:flex-start; gap:6px; margin:0; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
  .plat { display:inline-block; padding:0 5px; margin:1px 2px 1px 0; border-radius:8px; font-size:11px; border:1px solid var(--btn-border); color:var(--mute); }
  .req { font-size:11px; }
  /* SecondBrain 데스크톱 안: 제목과 뷰 탭은 사이드바가 맡는다(편집 중에는 탭을 보여 뷰를 더하고 이름을 바꾼다) */
  body.embed header h1 { display:none; }
  body.embed:not(.editing) #tabs { display:none; }
  /* 휴대폰(한 줄 배치): 위젯을 세로로 쌓고, 머리줄·설정 사이드바를 좁은 화면에 맞춘다 */
  .board.column { display:flex; flex-direction:column; gap:10px; }
  .board.column .widget { position:relative; width:100%; }
  body.mobile { font-size:14px; }
  body.mobile header { padding:6px 8px; gap:6px; }
  body.mobile header h1, body.mobile #info { display:none; }
  body.mobile .date { min-width:0; font-size:12px; }
  body.mobile #tabs { order:10; width:100%; margin-left:0; overflow-x:auto; flex-wrap:nowrap; padding-bottom:2px; }
  body.mobile .tab { flex:none; }
  body.mobile main { padding:8px 8px 48px; }
  body.mobile .wtools button { padding:3px 8px; font-size:13px; }
  body.mobile .addbar { flex-wrap:wrap; }
  body.mobile .addbar select { max-width:100%; }
  body.mobile .settings { flex-direction:column; min-height:0; }
  body.mobile .settings .side { width:auto; flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line); padding:6px; }
  body.mobile .settings .side .group { display:none; }
  body.mobile .settings .side .item { flex:none; }
  body.mobile .settings .content { padding:10px; }
  body.mobile table.rules, body.mobile table.plugins, body.mobile table.unmatched { display:block; overflow-x:auto; }
  body.mobile #src { width:100%; }
  body.mobile dialog { min-width:0; width:92vw; }
</style>
</head>
<body>
<header>
  <h1>SecondBrain</h1>
  <button id="prev">◀</button>
  <div class="date" id="date"></div>
  <button id="next">▶</button>
  <button id="today">오늘</button>
  <div id="tabs"></div>
  <div class="spacer"></div>
  <span id="info" class="mute"></span>
  <button id="edit">편집</button>
  <button id="settings">설정</button>
  <button id="plugins">플러그인</button>
  <button id="reload">새로고침</button>
</header>
<main id="main"><div class="empty">불러오는 중…</div></main>
<section id="pluginsPage" style="display:none"></section>
<section id="settingsPage" style="display:none"></section>
<dialog id="dlg"><h3 id="dlgTitle"></h3><form id="dlgForm" method="dialog" onsubmit="return false"></form><div class="row"><button id="dlgCancel">취소</button><button id="dlgOk">저장</button></div></dialog>
<div class="tip" id="tip"></div>
<script src="sdk.js"></script>
<script src="shell.js"></script>
<script src="plugins.js"></script>
</body>
</html>
